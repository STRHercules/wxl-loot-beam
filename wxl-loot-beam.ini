; wxl-loot-beam configuration.
;
; A light on the ground that rises into the sky over every NPC body that can still be looted, so a
; corpse is found by a beam instead of by hunting for its nameplate.
;
; Every knob the in-game "Loot Beam" panel exposes lives here too, so the look can be retuned from a
; text editor. This file is read live while the client runs: after saving a change here the module
; notices within about a second and applies it, no restart and no overlay needed. The panel's Save
; button writes the current slider values back into this file.
;
; Values are clamped to the ranges the panel uses, so an out-of-range number will not break anything.
; Lines beginning with ';' are comments and are left alone by Save.

[LootBeam]

; --- master ---------------------------------------------------------------------------------
; 1 turns the beacon on, 0 leaves corpses unmarked.
Enabled=1

; --- shape ----------------------------------------------------------------------------------
; How far the beam rises above the corpse, in yards (the 15 m the feature is specified with).
Height=15
; Radius of the glow painted on the ground, in yards.
GroundRadius=1.7
; Half-width of the beam where it meets the ground, in yards. It tapers toward the top.
BeamWidth=0.7
; How far above the body the shaft begins, in yards. It starts fully transparent there and gathers
; as it rises, so it floats rather than growing out of the corpse.
BaseOffset=1.0
; Minimum half-width per yard of camera distance, so a distant beam stays a legible column instead
; of thinning to a thread (0 disables it and leaves the fixed width/taper alone).
WidthPerYard=0.01
; Opacity of the ground glow at its centre and of the beam along its length, 0..1.
GroundAlpha=0.45
BeamAlpha=0.6
; Tint of the light, as #RRGGBB (or R,G,B with 0-255 components).
Color=#FFD070

; --- motion ---------------------------------------------------------------------------------
; Slow breathing depth, 0 (steady) .. 1 (fades to nothing at the trough of the pulse).
Pulse=0.2
; How fast the breathing runs.
PulseSpeed=1.6
; Seconds for a beacon to ease in when a body appears, and to ease away when it is looted or gone.
; 0 makes the change instant.
FadeIn=0.35
FadeOut=0.7

; --- selection ------------------------------------------------------------------------------
; Ignore corpses farther than this, yards. 0 = unlimited.
MaxDistance=0
; 1 = paint the glow on the ground / raise the beam; set either to 0 to keep just the other.
ShowGround=1
ShowBeam=1
; 1 = draw through terrain and walls (a marker you can always find, but it reads as a HUD overlay);
; 0 (default) = let the world occlude it, as light would be.
ThroughWalls=0
; How many yards to pull the beacon toward the camera along its view ray. At range the client renders
; terrain at a coarser LOD that sits above the collision height the beacon is placed on, and an exact
; depth test would hide the beacon beyond a few yards. The pull changes depth only, never screen
; position, so it clears that LOD without letting the beacon through anything really in front of it.
; Raise it if the beacon still vanishes at range; lower it toward 0 if it pokes through nearby cover.
DepthPush=1.5
; Extra pull per yard of camera distance, for depth error that grows with range. 0.02 means the pull
; grows by two yards per hundred yards. Raise if the beacon still disappears far away.
DepthPushPerYard=0.02
; 1 = only beam corpses the server still flags lootable (UNIT_DYNAMIC_FLAGS bit 0), so an
; already-looted body goes dark; 0 = beam any dead NPC.
RequireLootable=1
